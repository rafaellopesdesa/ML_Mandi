name: Application notebooks
on:
  push:
    paths:
      - "activities/application/**"
      - ".github/workflows/application-notebooks.yml"
  pull_request:
    paths:
      - "activities/application/**"
      - ".github/workflows/application-notebooks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: activities/application/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r activities/application/requirements.txt nbclient nbformat ipykernel
      - name: Run the sequence and a fresh-runtime fit
        env:
          MPLBACKEND: Agg
        run: python activities/application/check_notebooks.py
